# Daily installation canary: freshness.yml proves the registry *serves*;
# this proves what it serves actually *installs* into a real R session.
# The badge is the status light: red means the repo surface is broken for
# the pinned canaries. (#27)
name: install

on:
  schedule:
    - cron: "27 8 * * *"
  workflow_dispatch:

jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        universe: [bioc, bioc-release]
    runs-on: ubuntu-latest
    # The image r-universe itself builds packages in: current Ubuntu LTS,
    # current R release, and the system libraries R packages actually need
    # (gsl, netcdf, secret, hdf5, glpk, magick, gdal, ...). Replaces the
    # vanilla runner + apt-get + a denylist of "packages the runner cannot
    # build", which was whack-a-mole and shrank the sample pool. (#47)
    container: ghcr.io/r-universe-org/base-image:release
    timeout-minutes: 120
    env:
      REPO_URL: https://bioc-registry.seandavi.workers.dev/repo/${{ matrix.universe }}
    steps:
      - name: gh CLI for attestation verify (not in the image)
        # From GitHub's own apt repo: Ubuntu's packaged gh predates
        # `gh attestation`, which the last step needs.
        run: |
          install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh
          gh --version

      - name: Install pinned canaries (edgeR, limma)
        # Popular, modest dependency trees, present in both universes.
        # Installed from source from the registry, CRAN deps as binaries;
        # loadNamespace() proves the result is usable, not just unpacked.
        run: |
          Rscript -e '
            repos <- c(BIOC = Sys.getenv("REPO_URL"), CRAN = getOption("repos")[["CRAN"]])
            install.packages(c("edgeR", "limma"), repos = repos)
            invisible(lapply(c("edgeR", "limma"), loadNamespace))
          '

      - name: Install a random sample from the propagation index
        # Date-seeded so a failure reproduces on re-run the same day.
        # The r-universe image carries the system libraries, so a failure
        # here means the install path itself is broken and it fails the run:
        # a false positive costs a red badge, a miss costs users a broken
        # install. Findings land in the step summary either way.
        # repos: CRAN only from the image Rprofile, which also lists the
        # Bioconductor posit mirror. Appending all of getOption("repos")
        # would let anything missing from the registry install from
        # bioconductor.org, and the canary would stop testing the registry.
        run: |
          set -o pipefail
          Rscript -e '
            install.packages("jsonlite")
            idx <- jsonlite::fromJSON(sprintf(
              "https://bioc-registry.seandavi.workers.dev/data/prop/%s/index.json",
              "${{ matrix.universe }}"))
            repos <- c(BIOC = Sys.getenv("REPO_URL"), CRAN = getOption("repos")[["CRAN"]])
            db <- available.packages(repos = repos)
            candidates <- intersect(names(idx), rownames(db))
            closure <- tools::package_dependencies(candidates, db,
              which = c("Depends", "Imports", "LinkingTo"), recursive = TRUE)
            # Every dep must actually be resolvable from registry+CRAN:
            # annotation/experiment data packages have no build home yet (the
            # M2 workstream), so e.g. crisprScore -> crisprScoreData cannot
            # install here no matter what the registry does.
            base_pkgs <- rownames(installed.packages(priority = c("base", "recommended")))
            known <- c(rownames(db), base_pkgs, "R")
            eligible <- names(Filter(function(d) all(d %in% known), closure))
            cat("eligible:", length(eligible), "of", length(names(idx)), "\n")
            set.seed(as.integer(Sys.Date()))
            picks <- sample(eligible, min(3, length(eligible)))
            cat("sampled:", picks, "\n")
            install.packages(picks, repos = repos)
            invisible(lapply(picks, loadNamespace))
            cat("sample-result: all", length(picks), "loaded\n")
          ' 2>&1 | tee sample.log

      - name: Sample result into the run summary
        if: always()
        run: |
          [ -f sample.log ] || exit 0
          { echo "## Random-sample install: ${{ matrix.universe }}"
            echo '```'
            grep -E '^eligible:|^sampled:|^sample-result:|^Error|non-zero exit' sample.log || tail -3 sample.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install every bioc-build entry and verify its attestation
        # Issue #15 (install acceptance). Unlike the random sample above, this
        # isn't a spot-check: it is every origin=="bioc-build" entry in this
        # universe's index, so a regression in that whole ingest path (not
        # just the one package the sample happened to pick) always shows up
        # here. Kept as its own step (not folded into the sample step above)
        # so a failure here is a distinct red check in the run, separate from
        # the unrelated-to-bioc-build sample.
        env:
          GH_TOKEN: ${{ github.token }}  # gh attestation verify needs it even for a public repo
        run: |
          set -o pipefail
          {
            Rscript -e '
              install.packages("jsonlite")
              idx <- jsonlite::fromJSON(sprintf(
                "https://bioc-registry.seandavi.workers.dev/data/prop/%s/index.json",
                "${{ matrix.universe }}"), simplifyVector = FALSE)
              bb <- Filter(function(e) identical(e$origin, "bioc-build"), idx)
              cat("bioc-build entries:", length(bb), "\n")
              if (!length(bb)) quit(save = "no", status = 0)
              # Software comes from the registry (BioCsoft replaced) and CRAN;
              # annotation/experiment data dependencies have no build home yet
              # (bioc-build#32), so BioCann/BioCexp stay on the image mirror.
              repos <- getOption("repos")
              repos[["BioCsoft"]] <- Sys.getenv("REPO_URL")
              pkgs <- names(bb)
              # The set is ~2 GB of tarballs, up to 536 MB each; the default R
              # download timeout is 60 s.
              options(timeout = max(3600, getOption("timeout")))
              install.packages(pkgs, repos = repos)
              invisible(lapply(pkgs, loadNamespace))
              cat("bioc-build-result: all", length(pkgs), "loaded\n")
              # One file per package, for the shell loop below to verify.
              src <- function(e) Filter(function(a) identical(a$os, "src"), e$artifacts)[[1]]$file
              writeLines(vapply(bb, src, character(1)), "bioc-build-files.txt")
            '
            if [ -s bioc-build-files.txt ]; then
              while read -r file; do
                curl -fsSL -o "$file" "$REPO_URL/src/contrib/$file"
                echo "verifying attestation: $file"
                gh attestation verify "$file" --repo seandavi/bioc-build
              done < bioc-build-files.txt
            fi
          } 2>&1 | tee bioc-build.log

      - name: bioc-build result into the run summary
        if: always()
        run: |
          [ -f bioc-build.log ] || exit 0
          { echo "## bioc-build entries install + attestation: ${{ matrix.universe }}"
            echo '```'
            grep -E '^bioc-build entries:|^bioc-build-result:|^verifying attestation:|^Error|non-zero exit|sha256 digest|FAIL' bioc-build.log || tail -5 bioc-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
